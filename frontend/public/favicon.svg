<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#eef1f6" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a86f6" />
      <stop offset="1" stop-color="#3f6ef2" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dfe4ec" />
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f6" />
      <stop offset="1" stop-color="#e1e6f0" />
    </linearGradient>
    <linearGradient id="chk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a9bff" />
      <stop offset="1" stop-color="#3b6ef5" />
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f8dfa" />
      <stop offset="1" stop-color="#3b6ef5" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2b4fb0" flood-opacity="0.3" />
    </filter>
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f2b45" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- 아이콘 플레이트 -->
  <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#plate)" filter="url(#plateShadow)" />

  <!-- 캘린더 본체 -->
  <rect x="28" y="30" width="72" height="70" rx="12" fill="#ffffff" />

  <!-- 상단 파란 바 -->
  <path d="M28 54 V42 A12 12 0 0 1 40 30 H88 A12 12 0 0 1 100 42 V54 Z" fill="url(#bar)" />

  <!-- 바인더 링 -->
  <rect x="45" y="17" width="10" height="24" rx="5" fill="url(#ring)" filter="url(#soft)" />
  <rect x="79" y="17" width="10" height="24" rx="5" fill="url(#ring)" filter="url(#soft)" />

  <!-- 배경 타일 -->
  <g fill="url(#tile)">
    <rect x="35" y="60" width="16" height="16" rx="4" />
    <rect x="56" y="60" width="16" height="16" rx="4" />
    <rect x="77" y="60" width="16" height="16" rx="4" />
    <rect x="56" y="80" width="16" height="16" rx="4" />
  </g>

  <!-- 이동 대상 타일(연한 파랑) -->
  <rect x="77" y="80" width="16" height="16" rx="4" fill="#c7dbff" />

  <!-- 곡선 화살표: 완료 → 대상 (미루기) -->
  <g filter="url(#soft)">
    <path d="M56 71 C 68 58, 83 58, 86 71" fill="none" stroke="url(#arrow)" stroke-width="6.5" stroke-linecap="round" />
    <path d="M86 86 L78.5 72 L93.5 72 Z" fill="#3b6ef5" />
  </g>

  <!-- 모션 라인 (역동적 이동) -->
  <g stroke="#9dbcff" stroke-linecap="round">
    <line x1="16" y1="78" x2="31" y2="78" stroke-width="3" opacity="0.45" />
    <line x1="13" y1="85" x2="34" y2="85" stroke-width="3.6" opacity="0.7" />
    <line x1="17" y1="92" x2="31" y2="92" stroke-width="2.8" opacity="0.4" />
  </g>

  <!-- 완료 타일(파랑 + 체크) -->
  <g transform="rotate(-6 44 80)" filter="url(#soft)">
    <rect x="32" y="68" width="24" height="24" rx="7.5" fill="url(#chk)" />
    <path d="M38.5 80.5 l4 4 L50.5 73" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
