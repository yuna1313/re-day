openapi: 3.1.0
info:
  title: RE:DAY API
  version: 1.0.0
  description: RE:DAY MVP API 명세서입니다. 인증 방식은 JWT를 사용합니다.
servers:
- url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data: {}
      required:
      - success
      - code
      - message
      - data
    Member:
      type: object
      properties:
        memberId:
          type: integer
        nickname:
          type: string
        email:
          type: string
          format: email
      required:
      - memberId
      - nickname
      - email
    Schedule:
      type: object
      properties:
        scheduleId:
          type: integer
        title:
          type: string
        startAt:
          type: string
          description: yyyy-MM-dd HH:mm:ss 형식
        estimatedMinutes:
          type: integer
        actualMinutes:
          type:
          - integer
          - 'null'
        memo:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - PENDING
          - DONE
        completedAt:
          type:
          - string
          - 'null'
          description: yyyy-MM-dd HH:mm:ss 형식
        deferCount:
          type: integer
      required:
      - scheduleId
      - title
      - startAt
      - estimatedMinutes
      - status
      - deferCount
    DeferLog:
      type: object
      properties:
        actionLogId:
          type: integer
        actionType:
          type: string
          enum:
          - CREATED
          - UPDATED
          - DONE
          - DEFERRED
        deferReasonCode:
          type:
          - string
          - 'null'
        deferReasonDetail:
          type:
          - string
          - 'null'
        actionAt:
          type: string
          description: yyyy-MM-dd HH:mm:ss 형식
      required:
      - actionLogId
      - actionType
      - actionAt
    Reflection:
      type: object
      properties:
        reflectionId:
          type: integer
        reflectionDate:
          type: string
          description: yyyy-MM-dd 형식
        content:
          type: string
      required:
      - reflectionId
      - reflectionDate
      - content
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data: {}
      required:
      - success
      - code
      - message
      - data
  responses:
    UnauthorizedError:
      description: JWT 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            code: COMMON_401
            message: 인증이 필요하거나 토큰이 유효하지 않습니다.
            data: null
    ForbiddenError:
      description: 접근 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            code: COMMON_403
            message: 접근 권한이 없습니다.
            data: null
    LoginUnauthorized:
      description: 로그인 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            code: AUTH_INVALID_CREDENTIALS
            message: 이메일 또는 비밀번호가 올바르지 않습니다.
            data: null
    LoginForbidden:
      description: 로그인 제한
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            code: AUTH_EMAIL_NOT_VERIFIED
            message: 이메일 인증이 완료되지 않았습니다.
            data: null
    RefreshUnauthorized:
      description: 토큰 재발급 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            code: AUTH_REFRESH_INVALID
            message: refresh token이 유효하지 않거나 만료되었습니다.
            data: null
    RefreshForbidden:
      description: 토큰 재발급 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            code: COMMON_403
            message: 토큰 재발급 권한이 없습니다.
            data: null
paths:
  /auth/signup:
    post:
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                passwordConfirm:
                  type: string
                agreeTerms:
                  type: boolean
              required:
              - nickname
              - email
              - password
              - passwordConfirm
              - agreeTerms
      responses:
        '200':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      description: 이메일 기반으로 회원가입합니다. 로그인 전에 이메일 인증이 필요합니다.
  /auth/email/send-verification:
    post:
      summary: 이메일 인증코드 발송
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      description: 회원가입 시 사용할 이메일 인증코드를 발송합니다.
  /auth/email/verify:
    post:
      summary: 이메일 인증코드 확인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                verificationCode:
                  type: string
              required:
              - email
              - verificationCode
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      description: 인증코드를 검증하고 이메일 인증을 완료합니다.
  /auth/login:
    post:
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
              - email
              - password
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/LoginUnauthorized'
        '403':
          $ref: '#/components/responses/LoginForbidden'
      description: 이메일과 비밀번호로 로그인하고 accessToken과 refreshToken을 발급합니다.
  /auth/refresh:
    post:
      summary: 토큰 재발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/RefreshUnauthorized'
        '403':
          $ref: '#/components/responses/RefreshForbidden'
      description: refreshToken으로 accessToken을 재발급합니다.
  /auth/logout:
    post:
      summary: 로그아웃
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 로그아웃 처리하며 서버에서 refreshToken을 무효화합니다.
  /members/me:
    get:
      summary: 내 정보 조회
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 현재 로그인한 사용자의 마이페이지 정보를 조회합니다.
  /members/me/password:
    patch:
      summary: 비밀번호 변경
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
              required:
              - currentPassword
              - newPassword
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 현재 비밀번호와 새 비밀번호를 받아 비밀번호를 변경합니다.
  /schedules:
    get:
      summary: 일정 목록 조회
      security:
      - bearerAuth: []
      parameters:
      - name: viewType
        in: query
        required: true
        schema:
          type: string
          enum:
          - WEEK
          - MONTH
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          description: yyyy-MM-dd
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          description: yyyy-MM-dd
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 주간/월간 화면에 필요한 일정 목록을 조회합니다.
    post:
      summary: 일정 생성
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                startAt:
                  type: string
                  description: yyyy-MM-dd HH:mm:ss
                estimatedMinutes:
                  type: integer
                memo:
                  type:
                  - string
                  - 'null'
              required:
              - title
              - startAt
              - estimatedMinutes
      responses:
        '200':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 새 일정을 생성합니다.
  /schedules/{scheduleId}:
    get:
      summary: 일정 상세 조회
      security:
      - bearerAuth: []
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 일정 상세 정보와 미루기 로그를 조회합니다.
    patch:
      summary: 일정 수정
      security:
      - bearerAuth: []
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                startAt:
                  type: string
                  description: yyyy-MM-dd HH:mm:ss
                estimatedMinutes:
                  type: integer
                memo:
                  type:
                  - string
                  - 'null'
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 제목, 시작일시, 예상시간, 메모를 수정합니다.
    delete:
      summary: 일정 삭제
      security:
      - bearerAuth: []
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 일정을 삭제합니다. deletedAt을 설정하는 soft delete 방식입니다.
  /schedules/{scheduleId}/complete:
    post:
      summary: 일정 완료 처리
      security:
      - bearerAuth: []
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actualMinutes:
                  type: integer
              required:
              - actualMinutes
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 일정을 완료 처리하고 실제 소요 시간을 저장합니다.
  /schedules/{scheduleId}/defer:
    post:
      summary: 일정 미루기 처리
      security:
      - bearerAuth: []
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deferReasonCode:
                  type: string
                deferReasonDetail:
                  type:
                  - string
                  - 'null'
                newStartAt:
                  type:
                  - string
                  - 'null'
                  description: yyyy-MM-dd HH:mm:ss
              required:
              - deferReasonCode
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 미루기 사유를 저장하고 필요 시 시작일시를 변경합니다.
  /reflections/today:
    get:
      summary: 오늘 회고 조회
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 오늘 회고와 오늘 완료한 일정 목록을 조회합니다.
  /reflections/{date}:
    get:
      summary: 날짜별 회고 조회
      security:
      - bearerAuth: []
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          description: yyyy-MM-dd
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 특정 날짜의 회고를 조회합니다.
  /reflections:
    post:
      summary: 회고 작성
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reflectionDate:
                  type: string
                  description: yyyy-MM-dd
                content:
                  type: string
              required:
              - reflectionDate
              - content
      responses:
        '200':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 회고를 작성합니다. 회원별 같은 날짜에는 1개만 작성할 수 있습니다.
  /reflections/{reflectionId}:
    patch:
      summary: 회고 수정
      security:
      - bearerAuth: []
      parameters:
      - name: reflectionId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required:
              - content
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 회고 내용을 수정합니다.
  /analytics/insights:
    get:
      summary: 인사이트 조회
      security:
      - bearerAuth: []
      parameters:
      - name: periodType
        in: query
        required: false
        schema:
          type: string
          enum:
          - LAST_7_DAYS
          - LAST_30_DAYS
          default: LAST_30_DAYS
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 시간대별 완료율, 미루기 상위 이유, 예상 대비 실제 평균 인사이트를 조회합니다.
  /push/token:
    post:
      summary: 기기 토큰 등록
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceToken:
                  type: string
                platform:
                  type: string
                  enum:
                  - IOS
                  - ANDROID
              required:
              - deviceToken
              - platform
      responses:
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 푸시 알림 발송을 위해 기기 토큰을 등록합니다.
