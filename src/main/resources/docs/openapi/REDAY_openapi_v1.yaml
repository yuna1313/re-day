openapi: 3.1.0
info:
  title: RE:DAY API
  version: 1.0.0
  description: 'RE:DAY 백엔드 API 문서


    응답 정책:

    - 일반 API는 성공/일반 실패 모두 HTTP 200을 사용하고, 본문의 success/code/message로 결과를 구분합니다.

    - JWT 인증 관련 실패만 HTTP 401/403을 사용합니다.

    - 각 엔드포인트의 200 응답에는 가능한 일반 실패 예시를 examples로 포함했습니다.'
servers:
- url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data: {}
      required:
      - success
      - code
      - message
      - data
    Member:
      type: object
      properties:
        memberId:
          type: integer
        nickname:
          type: string
        email:
          type: string
          format: email
      required:
      - memberId
      - nickname
      - email
    Schedule:
      type: object
      properties:
        scheduleId:
          type: integer
        title:
          type: string
        startAt:
          type: string
          description: yyyy-MM-dd HH:mm:ss 형식
        estimatedMinutes:
          type: integer
        actualMinutes:
          type:
          - integer
          - 'null'
        memo:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - PENDING
          - DONE
        completedAt:
          type:
          - string
          - 'null'
          description: yyyy-MM-dd HH:mm:ss 형식
        deferCount:
          type: integer
      required:
      - scheduleId
      - title
      - startAt
      - estimatedMinutes
      - status
      - deferCount
    DeferLog:
      type: object
      properties:
        actionLogId:
          type: integer
        actionType:
          type: string
          enum:
          - CREATED
          - UPDATED
          - DONE
          - DEFERRED
        deferReasonCode:
          type:
          - string
          - 'null'
        deferReasonDetail:
          type:
          - string
          - 'null'
        actionAt:
          type: string
          description: yyyy-MM-dd HH:mm:ss 형식
      required:
      - actionLogId
      - actionType
      - actionAt
    Reflection:
      type: object
      properties:
        reflectionId:
          type: integer
        reflectionDate:
          type: string
          description: yyyy-MM-dd 형식
        content:
          type: string
      required:
      - reflectionId
      - reflectionDate
      - content
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data: {}
      required:
      - success
      - code
      - message
      - data
  responses:
    UnauthorizedError:
      description: JWT 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            code: COMMON_UNAUTHORIZED_FAIL
            message: 인증이 필요합니다.
            data: null
    ForbiddenError:
      description: 접근 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            code: COMMON_FORBIDDEN_FAIL
            message: 접근 권한이 없습니다.
            data: null
    LoginUnauthorized:
      description: 로그인 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          examples:
            AUTH_LOGIN_FAIL:
              summary: 로그인에 실패하였습니다.
              description: 로그인 처리 중 알 수 없는 오류가 발생한 경우
              value:
                success: false
                code: AUTH_LOGIN_FAIL
                message: 로그인에 실패하였습니다.
                data: null
            AUTH_INVALID_CREDENTIALS_FAIL:
              summary: 이메일 또는 비밀번호가 올바르지 않습니다.
              description: 이메일 또는 비밀번호가 일치하지 않는 경우
              value:
                success: false
                code: AUTH_INVALID_CREDENTIALS_FAIL
                message: 이메일 또는 비밀번호가 올바르지 않습니다.
                data: null
    LoginForbidden:
      description: 로그인 제한
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          examples:
            AUTH_EMAIL_NOT_VERIFIED_FAIL:
              summary: 이메일 인증이 완료되지 않았습니다.
              description: 이메일 인증이 완료되지 않은 계정으로 로그인한 경우
              value:
                success: false
                code: AUTH_EMAIL_NOT_VERIFIED_FAIL
                message: 이메일 인증이 완료되지 않았습니다.
                data: null
    RefreshUnauthorized:
      description: 토큰 재발급 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          examples:
            AUTH_TOKEN_REFRESH_FAIL:
              summary: 토큰 재발급에 실패하였습니다.
              description: 토큰 재발급 처리 중 알 수 없는 오류가 발생한 경우
              value:
                success: false
                code: AUTH_TOKEN_REFRESH_FAIL
                message: 토큰 재발급에 실패하였습니다.
                data: null
            AUTH_INVALID_REFRESH_TOKEN_FAIL:
              summary: 유효하지 않은 리프레시 토큰입니다.
              description: 리프레시 토큰이 잘못되었거나 존재하지 않는 경우
              value:
                success: false
                code: AUTH_INVALID_REFRESH_TOKEN_FAIL
                message: 유효하지 않은 리프레시 토큰입니다.
                data: null
            AUTH_REFRESH_TOKEN_EXPIRED_FAIL:
              summary: 리프레시 토큰이 만료되었습니다.
              description: 리프레시 토큰 만료일이 지난 경우
              value:
                success: false
                code: AUTH_REFRESH_TOKEN_EXPIRED_FAIL
                message: 리프레시 토큰이 만료되었습니다.
                data: null
    RefreshForbidden:
      description: 토큰 재발급 제한
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          examples:
            AUTH_REFRESH_TOKEN_REVOKED_FAIL:
              summary: 이미 무효화된 리프레시 토큰입니다.
              description: 폐기된 리프레시 토큰으로 재발급을 시도한 경우
              value:
                success: false
                code: AUTH_REFRESH_TOKEN_REVOKED_FAIL
                message: 이미 무효화된 리프레시 토큰입니다.
                data: null
    LogoutUnauthorized:
      description: 로그아웃 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          examples:
            AUTH_LOGOUT_FAIL:
              summary: 로그아웃에 실패하였습니다.
              description: 로그아웃 처리 중 알 수 없는 오류가 발생한 경우
              value:
                success: false
                code: AUTH_LOGOUT_FAIL
                message: 로그아웃에 실패하였습니다.
                data: null
            AUTH_INVALID_REFRESH_TOKEN_FAIL:
              summary: 유효하지 않은 리프레시 토큰입니다.
              description: 리프레시 토큰 형식이 잘못되었거나 저장된 토큰과 일치하지 않는 경우
              value:
                success: false
                code: AUTH_INVALID_REFRESH_TOKEN_FAIL
                message: 유효하지 않은 리프레시 토큰입니다.
                data: null
    LogoutForbidden:
      description: 로그아웃 제한
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          examples:
            AUTH_REFRESH_TOKEN_REVOKED_FAIL:
              summary: 이미 무효화된 리프레시 토큰입니다.
              description: 이미 폐기된 리프레시 토큰으로 로그아웃 요청한 경우
              value:
                success: false
                code: AUTH_REFRESH_TOKEN_REVOKED_FAIL
                message: 이미 무효화된 리프레시 토큰입니다.
                data: null
paths:
  /auth/signup:
    post:
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                passwordConfirm:
                  type: string
                agreeTerms:
                  type: boolean
              required:
              - nickname
              - email
              - password
              - passwordConfirm
              - agreeTerms
      responses:
        '200':
          description: 요청 성공 또는 일반 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                AUTH_SIGNUP_SUCCESS:
                  summary: 회원가입 성공
                  value:
                    success: true
                    code: AUTH_SIGNUP_SUCCESS
                    message: 회원가입이 완료되었습니다. 이메일 인증을 진행해주세요.
                    data:
                      memberId: 1
                      email: manggom@example.com
                AUTH_SIGNUP_FAIL:
                  summary: 회원가입에 실패하였습니다.
                  description: 회원가입 처리 중 알 수 없는 오류가 발생한 경우
                  value:
                    success: false
                    code: AUTH_SIGNUP_FAIL
                    message: 회원가입에 실패하였습니다.
                    data: null
                AUTH_EMAIL_DUPLICATED_FAIL:
                  summary: 이미 사용 중인 이메일입니다.
                  description: 동일한 이메일로 가입된 회원이 이미 존재하는 경우
                  value:
                    success: false
                    code: AUTH_EMAIL_DUPLICATED_FAIL
                    message: 이미 사용 중인 이메일입니다.
                    data: null
                AUTH_INVALID_EMAIL_FORMAT_FAIL:
                  summary: 이메일 형식이 올바르지 않습니다.
                  description: 이메일 형식 검증에 실패한 경우
                  value:
                    success: false
                    code: AUTH_INVALID_EMAIL_FORMAT_FAIL
                    message: 이메일 형식이 올바르지 않습니다.
                    data: null
                AUTH_INVALID_PASSWORD_FORMAT_FAIL:
                  summary: 비밀번호 형식이 올바르지 않습니다.
                  description: 비밀번호 정책(길이/문자 조합 등)을 만족하지 못한 경우
                  value:
                    success: false
                    code: AUTH_INVALID_PASSWORD_FORMAT_FAIL
                    message: 비밀번호 형식이 올바르지 않습니다.
                    data: null
                AUTH_INVALID_NICKNAME_FAIL:
                  summary: 닉네임 형식이 올바르지 않습니다.
                  description: 닉네임 길이 또는 허용 문자 조건을 만족하지 못한 경우
                  value:
                    success: false
                    code: AUTH_INVALID_NICKNAME_FAIL
                    message: 닉네임 형식이 올바르지 않습니다.
                    data: null
                AUTH_REQUIRED_AGREEMENT_MISSING_FAIL:
                  summary: 필수 약관 동의가 필요합니다.
                  description: 필수 약관 동의 여부가 false인 경우
                  value:
                    success: false
                    code: AUTH_REQUIRED_AGREEMENT_MISSING_FAIL
                    message: 필수 약관 동의가 필요합니다.
                    data: null
      description: 이메일 기반으로 회원가입합니다. 로그인 전에 이메일 인증이 필요합니다.
  /auth/email/send-verification:
    post:
      summary: 이메일 인증코드 발송
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      responses:
        '200':
          description: 요청 성공 또는 일반 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                AUTH_EMAIL_SENT:
                  summary: 인증코드 발송 성공
                  value:
                    success: true
                    code: AUTH_EMAIL_SENT
                    message: 인증코드를 발송했습니다.
                    data: null
                AUTH_EMAIL_SEND_FAIL:
                  summary: 이메일 인증코드 발송에 실패하였습니다.
                  description: 메일 발송 중 오류가 발생한 경우
                  value:
                    success: false
                    code: AUTH_EMAIL_SEND_FAIL
                    message: 이메일 인증코드 발송에 실패하였습니다.
                    data: null
                AUTH_EMAIL_NOT_FOUND_FAIL:
                  summary: 가입되지 않은 이메일입니다.
                  description: 인증 코드 발송 대상 이메일이 존재하지 않는 경우
                  value:
                    success: false
                    code: AUTH_EMAIL_NOT_FOUND_FAIL
                    message: 가입되지 않은 이메일입니다.
                    data: null
                AUTH_TOO_MANY_VERIFICATION_REQUESTS_FAIL:
                  summary: 인증코드 요청 횟수가 너무 많습니다.
                  description: 짧은 시간 내 인증코드 재요청 횟수 제한을 초과한 경우
                  value:
                    success: false
                    code: AUTH_TOO_MANY_VERIFICATION_REQUESTS_FAIL
                    message: 인증코드 요청 횟수가 너무 많습니다.
                    data: null
      description: 회원가입 시 사용할 이메일 인증코드를 발송합니다.
  /auth/email/verify:
    post:
      summary: 이메일 인증코드 확인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                verificationCode:
                  type: string
              required:
              - email
              - verificationCode
      responses:
        '200':
          description: 요청 성공 또는 일반 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                AUTH_EMAIL_VERIFIED:
                  summary: 이메일 인증 성공
                  value:
                    success: true
                    code: AUTH_EMAIL_VERIFIED
                    message: 이메일 인증이 완료되었습니다.
                    data: null
                AUTH_EMAIL_VERIFY_FAIL:
                  summary: 이메일 인증에 실패하였습니다.
                  description: 이메일 인증 처리 중 알 수 없는 오류가 발생한 경우
                  value:
                    success: false
                    code: AUTH_EMAIL_VERIFY_FAIL
                    message: 이메일 인증에 실패하였습니다.
                    data: null
                AUTH_INVALID_VERIFICATION_CODE_FAIL:
                  summary: 인증코드가 올바르지 않습니다.
                  description: 입력한 인증코드가 저장된 코드와 일치하지 않는 경우
                  value:
                    success: false
                    code: AUTH_INVALID_VERIFICATION_CODE_FAIL
                    message: 인증코드가 올바르지 않습니다.
                    data: null
                AUTH_VERIFICATION_CODE_EXPIRED_FAIL:
                  summary: 인증코드가 만료되었습니다.
                  description: 인증코드 유효시간이 지난 경우
                  value:
                    success: false
                    code: AUTH_VERIFICATION_CODE_EXPIRED_FAIL
                    message: 인증코드가 만료되었습니다.
                    data: null
      description: 인증코드를 검증하고 이메일 인증을 완료합니다.
  /auth/login:
    post:
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
              - email
              - password
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                AUTH_LOGIN_SUCCESS:
                  summary: 로그인 성공
                  value:
                    success: true
                    code: AUTH_LOGIN_SUCCESS
                    message: 로그인에 성공했습니다.
                    data:
                      accessToken: jwt-access-token
                      refreshToken: jwt-refresh-token
                      member:
                        memberId: 1
                        nickname: 망고미
                        email: manggom@example.com
        '401':
          $ref: '#/components/responses/LoginUnauthorized'
        '403':
          $ref: '#/components/responses/LoginForbidden'
      description: 이메일과 비밀번호로 로그인하고 accessToken과 refreshToken을 발급합니다.
  /auth/refresh:
    post:
      summary: 토큰 재발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
      responses:
        '200':
          description: 토큰 재발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                AUTH_TOKEN_REFRESHED:
                  summary: 토큰 재발급 성공
                  value:
                    success: true
                    code: AUTH_TOKEN_REFRESHED
                    message: 토큰이 재발급되었습니다.
                    data:
                      accessToken: new-jwt-access-token
                      refreshToken: new-jwt-refresh-token
        '401':
          $ref: '#/components/responses/RefreshUnauthorized'
        '403':
          $ref: '#/components/responses/RefreshForbidden'
      description: refreshToken으로 accessToken을 재발급합니다.
  /auth/logout:
    post:
      summary: 로그아웃
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                AUTH_LOGOUT_SUCCESS:
                  summary: 로그아웃 성공
                  value:
                    success: true
                    code: AUTH_LOGOUT_SUCCESS
                    message: 로그아웃되었습니다.
                    data: null
        '401':
          $ref: '#/components/responses/LogoutUnauthorized'
        '403':
          $ref: '#/components/responses/LogoutForbidden'
      description: 로그아웃 처리하며 서버에서 refreshToken을 무효화합니다.
  /members/me:
    get:
      summary: 내 정보 조회
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 요청 성공 또는 일반 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                MEMBER_ME_SUCCESS:
                  summary: 내 정보 조회 성공
                  value:
                    success: true
                    code: MEMBER_ME_SUCCESS
                    message: 내 정보 조회에 성공했습니다.
                    data:
                      memberId: 1
                      nickname: 망고미
                      email: manggom@example.com
                MEMBER_NOT_FOUND_FAIL:
                  summary: 회원 정보를 찾을 수 없습니다.
                  description: 인증된 사용자에 해당하는 회원 정보가 존재하지 않는 경우
                  value:
                    success: false
                    code: MEMBER_NOT_FOUND_FAIL
                    message: 회원 정보를 찾을 수 없습니다.
                    data: null
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: 현재 로그인한 사용자의 마이페이지 정보를 조회합니다.
  /members/me/password:
    patch:
      summary: 비밀번호 변경
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
              required:
              - currentPassword
              - newPassword
      responses:
        '200':
          description: 요청 성공 또는 일반 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
