spring:
  application:
    name: reday
  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  # 메일(SMTP) 공통 설정. 자격증명(username/password)은 프로필별로 주입한다.
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  access-token-expiration: 30m
  refresh-token-expiration: 14d

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /docs/openapi/REDAY_openapi_v1.yaml
